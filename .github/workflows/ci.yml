name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Proves the migration set applies cleanly to an empty database before it
      # is ever pointed at a real one. Runs against local D1 state, so it needs
      # no Cloudflare credentials.
      - name: Verify migrations apply to an empty database
        run: npx wrangler d1 migrations apply coglin-staging --local
